<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tipping Point</title>
    <!-- Pixel display font for titles, the speech bubble and buttons. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
  </head>
  <body>
    <!-- The stage fills the whole window, behind the interface: the dock scene, the pirate, the
         barrel and the scale in one drawing. The viewBox is the camera (camera.ts): it is always
         shown in full, and the scenery runs on past its edges to fill whatever shape the window is. -->
    <svg id="scale" class="stage" viewBox="-100 -520 600 1100" role="img" aria-label="A balance scale">
        <defs>
          <!-- Fallback for objects without art yet: a plain brass weight. -->
          <symbol id="weight" viewBox="0 0 16 12" preserveAspectRatio="xMidYMax meet" overflow="visible">
            <rect x="6.5" y="0" width="3" height="3" rx="1" fill="#8c6a2f" />
            <path d="M4.5 3 H11.5 L13.5 12 H2.5Z" fill="#a8842f" />
          </symbol>
          <!-- Below the market picture, its own front boardwalk keeps going: a strip of clean
               planks from the bottom middle (art x 150 to 254, y 195 to 225) repeats sideways,
               every other copy mirrored, and downward. It starts right under that strip, so the
               planks run straight on. -->
          <pattern id="boardwalk" patternUnits="userSpaceOnUse" x="-55.5" y="300" width="572" height="82.5">
            <!-- Each half is a nested <svg>, which clips the picture to just that strip. -->
            <svg width="286" height="82.5">
              <image href="/src/assets/art/market.png" x="-412.5" y="-536.25" width="1111" height="618.75" />
            </svg>
            <svg width="286" height="82.5" transform="translate(572 0) scale(-1 1)">
              <image href="/src/assets/art/market.png" x="-412.5" y="-536.25" width="1111" height="618.75" />
            </svg>
          </pattern>
        </defs>

        <!-- The dock, back to front. Every piece is its own image so each can move by itself
             (style.css); sizes are in the same units as the scale.
             Widths are in units, sized so every sprite shares one pixel grid: at the current art one
             pixel is 5.5 units, and art drawn at twice the detail (art/README.md) lands at 2.75. -->
        <image href="/src/assets/art/sky.png" x="-1400" y="-1300" width="3200" height="1500" preserveAspectRatio="none" />
        <image class="cloud" href="/src/assets/art/cloud-1.png" y="-190" width="110" style="animation-duration: 150s; animation-delay: -20s" />
        <image class="cloud" href="/src/assets/art/cloud-2.png" y="-110" width="110" style="animation-duration: 110s; animation-delay: -70s" />
        <image class="cloud" href="/src/assets/art/cloud-3.png" y="-150" width="110" style="animation-duration: 130s; animation-delay: -100s" />
        <image class="cloud" href="/src/assets/art/cloud-4.png" y="-80" width="110" style="animation-duration: 95s; animation-delay: -45s" />
        <g class="sea">
          <!-- Every other tile is mirrored, so neighbouring edges always match. -->
          <image href="/src/assets/art/sea.png" x="-1504" y="-50" width="682" />
          <image href="/src/assets/art/sea.png" x="-822" y="-50" width="682" transform="translate(-962 0) scale(-1 1)" />
          <image href="/src/assets/art/sea.png" x="-140" y="-50" width="682" />
          <image href="/src/assets/art/sea.png" x="542" y="-50" width="682" transform="translate(1766 0) scale(-1 1)" />
          <image href="/src/assets/art/sea.png" x="1224" y="-50" width="682" />
          <g fill="#bfe6f0">
            <rect class="sparkle" x="20" y="-22" width="14" height="2" /><rect class="sparkle" x="118" y="10" width="10" height="2" style="animation-delay: -1.1s" />
            <rect class="sparkle" x="262" y="-14" width="12" height="2" style="animation-delay: -2s" /><rect class="sparkle" x="330" y="24" width="16" height="2" style="animation-delay: -.6s" />
            <rect class="sparkle" x="-30" y="32" width="12" height="2" style="animation-delay: -1.6s" /><rect class="sparkle" x="390" y="2" width="10" height="2" style="animation-delay: -2.6s" />
          </g>
        </g>
        <!-- The harbour market, cut from one picture into layers (art/README.md): the ships ride
             the water behind it, and sky and sea show through the gap down the middle. Every
             layer is 404 x 225 art pixels drawn at 2.75 units each, at the same spot, so they
             line up. The gap is centred on the pirate and his scale. -->
        <image class="bob" href="/src/assets/art/ship-left.png" x="-468" y="-318.75" width="1111" height="618.75" style="animation-duration: 3.7s" />
        <image class="bob" href="/src/assets/art/ship-right.png" x="-468" y="-318.75" width="1111" height="618.75" style="animation-duration: 4.6s; animation-delay: -1.3s" />
        <image href="/src/assets/art/market.png" x="-468" y="-318.75" width="1111" height="618.75" />
        <!-- Mirrored copies either side, for windows wider than the picture. -->
        <image href="/src/assets/art/market.png" x="-468" y="-318.75" width="1111" height="618.75" transform="translate(-936 0) scale(-1 1)" />
        <image href="/src/assets/art/market.png" x="-468" y="-318.75" width="1111" height="618.75" transform="translate(1286 0) scale(-1 1)" />
        <rect x="-3000" y="300" width="6400" height="1300" fill="url(#boardwalk)" />

        <!-- The pirate stands to the left of the barrel, so the scale has clear sea and sky
             behind it. This is his sprite's top-left corner; pirate.ts draws him at one art
             pixel = 2.75 units, so his boots rest at y 250. -->
        <g id="pirate" transform="translate(-135 -88)"></g>

        <!-- The barrel, nearer the camera than the pirate. The scale sits on its lid. -->
        <image href="/src/assets/art/barrel.png" x="199.5" y="205" width="121" />

        <!-- The scale itself, shrunk and moved so its base (200, 300) rests on the barrel lid.
             Its sizes are in its own units (one unit here is 0.75 of a scene unit). -->
        <g id="rig" transform="translate(260 217) scale(0.75) translate(-200 -300)">
        <image href="/src/assets/art/scale-stand.png" x="163.33" y="87.3" width="73.33" />

        <!-- beam + needle rotate about the pivot -->
        <g id="needle"><path d="M200 110 L200 70" stroke="#1f1a17" stroke-width="5" stroke-linecap="square" /><path d="M200 110 L200 72" stroke="#e0a52e" stroke-width="2" /></g>
        <g id="beam"><image href="/src/assets/art/scale-beam.png" x="46" y="88" width="308" /></g>

        <!-- pans hang from the beam ends and stay level; objects stand on the plate -->
        <g id="pan-left">
          <image href="/src/assets/art/scale-pan.png" x="-51.33" y="-4" width="102.67" />
          <g id="anchor-art" transform="translate(-58.67 14.7)"></g>
        </g>
        <g id="pan-right">
          <image href="/src/assets/art/scale-pan.png" x="-51.33" y="-4" width="102.67" />
          <g id="pile" transform="translate(0 130)"></g>
        </g>
        </g>
      </svg>

    <main class="game">
      <!-- Welcome screen, part 1: the name. Hidden once the game starts. -->
      <div class="welcome" data-welcome>
        <p class="title">Tipping Point</p>
        <p class="tagline">The daily weigh-in</p>
      </div>

      <header>
        <p id="progress" class="eyebrow" hidden></p>
        <!-- The pirate's speech bubble; a plain heading on the results screen. -->
        <h1 id="question" class="bubble"></h1>
      </header>


      <!-- Welcome screen, part 2: the rules and the one button. -->
      <div class="welcome panel" data-welcome>
        <p class="rules">5 weigh-ins · one shot each · the closer your guess, the more level the scale</p>
        <button type="button" id="start" class="commit">Step up to the scale</button>
      </div>

      <div id="play" class="panel" hidden>

      <p id="count-readout" class="readout" aria-live="off">&nbsp;</p>

      <form id="controls" class="controls" autocomplete="off">
        <div class="stepper">
          <button type="button" id="guess-down" aria-label="Fewer">−</button>
          <input id="guess" type="number" inputmode="numeric" min="1" max="1000000000" aria-label="Your guess" />
          <button type="button" id="guess-up" aria-label="More">+</button>
        </div>
        <button type="submit" id="commit" class="commit">Weigh it</button>
      </form>

      <section id="reveal" class="reveal" hidden aria-live="polite">
        <p class="answer">It takes about <strong id="answer"></strong>.</p>
        <p id="result" class="result"></p>
        <p id="fact" class="fact"></p>
        <button type="button" id="next" class="commit next" hidden>Next weigh-in</button>
      </section>
      </div>

      <!-- End of the day: total, rating, a recap of all five rounds and the share button. -->
      <section id="results" class="results panel" hidden>
        <p class="total"><strong id="total"></strong> <span id="total-max"></span></p>
        <p id="rating" class="rating"></p>
        <!-- Filled in only when the stats server answers (see crowd.ts). -->
        <p id="crowd-rank" class="crowd-rank" hidden></p>
        <ol id="rounds" class="rounds"></ol>
        <button type="button" id="share" class="commit">Copy results</button>
        <pre id="share-text" class="share-text"></pre>
      </section>

      <button type="button" id="reset" class="dev" hidden>Reset (dev only)</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

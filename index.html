<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tipping Point</title>
    <!-- Pixel display font for titles, the speech bubble and buttons. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap" />
  </head>
  <body>
    <!-- The stage fills the whole window, behind the interface: the dock scene, the pirate, the
         barrel and the scale in one drawing. The viewBox is the camera (camera.ts): it is always
         shown in full, with its bottom on the window's bottom. A taller window shows more sky
         above it, a wider one more of the market on each side. -->
    <svg id="scale" class="stage" viewBox="-160 -230 600 680" preserveAspectRatio="xMidYMax meet" role="img" aria-label="A balance scale">
        <defs>
          <!-- Fallback for objects without art yet: a plain brass weight. -->
          <symbol id="weight" viewBox="0 0 16 12" preserveAspectRatio="xMidYMax meet" overflow="visible">
            <rect x="6.5" y="0" width="3" height="3" rx="1" fill="#8c6a2f" />
            <path d="M4.5 3 H11.5 L13.5 12 H2.5Z" fill="#a8842f" />
          </symbol>
        </defs>

        <!-- The dock, back to front. Every piece is its own image so each can move by itself
             (style.css); sizes are in the same units as the scale.
             Widths are in units, sized so every sprite shares one pixel grid: at the current art one
             pixel is 5.5 units, and art drawn at twice the detail (art/README.md) lands at 2.75. -->
        <!-- Sky: flat pixel-art bands in the market picture's own colours (sampled from it), from
             high above any window down to the sunlit haze at the horizon. -->
        <g>
          <rect x="-3000" y="-4000" width="7000" height="3820" fill="#96c6d4" />
          <rect x="-3000" y="-180" width="7000" height="66" fill="#b1cfc7" />
          <rect x="-3000" y="-114" width="7000" height="69" fill="#d0d4b6" />
          <rect x="-3000" y="-45" width="7000" height="90" fill="#e3c792" />
        </g>
        <image class="cloud" href="/src/assets/art/cloud-1.png" y="-190" width="110" style="animation-duration: 150s; animation-delay: -20s" />
        <image class="cloud" href="/src/assets/art/cloud-2.png" y="-110" width="110" style="animation-duration: 110s; animation-delay: -70s" />
        <image class="cloud" href="/src/assets/art/cloud-3.png" y="-150" width="110" style="animation-duration: 130s; animation-delay: -100s" />
        <image class="cloud" href="/src/assets/art/cloud-4.png" y="-80" width="110" style="animation-duration: 95s; animation-delay: -45s" />
        <g class="sea">
          <!-- Every other tile is mirrored, so neighbouring edges always match. -->
          <image href="/src/assets/art/sea.png" x="-1504" y="41" width="682" />
          <image href="/src/assets/art/sea.png" x="-822" y="41" width="682" transform="translate(-962 0) scale(-1 1)" />
          <image href="/src/assets/art/sea.png" x="-140" y="41" width="682" />
          <image href="/src/assets/art/sea.png" x="542" y="41" width="682" transform="translate(1766 0) scale(-1 1)" />
          <image href="/src/assets/art/sea.png" x="1224" y="41" width="682" />
          <g fill="#bfe6f0">
            <rect class="sparkle" x="20" y="69" width="14" height="2" /><rect class="sparkle" x="118" y="101" width="10" height="2" style="animation-delay: -1.1s" />
            <rect class="sparkle" x="262" y="77" width="12" height="2" style="animation-delay: -2s" /><rect class="sparkle" x="330" y="115" width="16" height="2" style="animation-delay: -.6s" />
            <rect class="sparkle" x="-30" y="123" width="12" height="2" style="animation-delay: -1.6s" /><rect class="sparkle" x="390" y="93" width="10" height="2" style="animation-delay: -2.6s" />
          </g>
        </g>
        <!-- The harbour market (art/README.md), with its sky and water cut out so the moving sky,
             clouds and sea show through the gap down the middle. 633 x 268 art pixels at 2.75
             units each. The gap is centred on the pirate and his scale, and the camera never
             looks past the picture's sides (camera.ts, SCENE). -->
        <image href="/src/assets/art/market.png" x="-781.75" y="-287" width="1740.75" height="737" />

        <!-- The pirate stands at the front of the boardwalk, beside his scale. This is his sprite's
             top-left corner; pirate.ts draws him at one art pixel = 2.75 units, so his boots rest
             at y 425, just behind the front barrels' depth. -->
        <g id="pirate" transform="translate(-135 87)"></g>

        <!-- The barrel, a little nearer the camera than the pirate. The scale sits on its lid. -->
        <image href="/src/assets/art/barrel.png" x="199.5" y="263.5" width="121" />

        <!-- The scale itself, shrunk and moved so its base (200, 300) rests on the barrel lid.
             Its sizes are in its own units (one unit here is 0.75 of a scene unit). -->
        <g id="rig" transform="translate(260 293.75) scale(0.75) translate(-200 -300)">
        <image href="/src/assets/art/scale-stand.png" x="156" y="77" width="84.33" />

        <!-- the beam rotates about the pivot, the ball near the top of the stand -->
        <g id="beam"><image href="/src/assets/art/scale-beam.png" x="64.33" y="95.33" width="267.67" /></g>

        <!-- pans hang from the beam ends and stay level; objects stand on the plate -->
        <g id="pan-left">
          <image href="/src/assets/art/scale-pan.png" x="-56.83" y="-3.67" width="110" />
          <g id="anchor-art" transform="translate(-58.67 14.7)"></g>
        </g>
        <g id="pan-right">
          <image href="/src/assets/art/scale-pan.png" x="-56.83" y="-3.67" width="110" />
          <g id="pile" transform="translate(0 130)"></g>
        </g>
        </g>

        <!-- The two barrels at the front right of the market, cut out of the same picture
             (scripts/process-art.mjs) and drawn again over everything, so the pirate walks in
             behind them. -->
        <image href="/src/assets/art/market-front.png" x="-781.75" y="-287" width="1740.75" height="737" />
      </svg>

    <main class="game">
      <!-- Welcome screen, part 1: the name. Hidden once the game starts. -->
      <div class="welcome" data-welcome>
        <p class="title">Tipping Point</p>
        <p class="tagline">The daily weigh-in</p>
      </div>

      <header>
        <p id="progress" class="eyebrow" hidden></p>
        <!-- The pirate's speech bubble. Everything to read or press lives in it, so nothing
             covers the pirate and his scale at the bottom of the window. A plain heading on the
             results screen. -->
        <div id="bubble" class="bubble">
          <h1 id="question"></h1>

          <!-- Welcome screen, part 2: the rules and the one button. -->
          <div class="welcome" data-welcome>
            <p class="rules">5 weigh-ins · one shot each · the closer your guess, the more level the scale</p>
            <button type="button" id="start" class="commit">Step up to the scale</button>
          </div>

          <div id="play" hidden>
            <p id="count-readout" class="readout" aria-live="off">&nbsp;</p>

            <form id="controls" class="controls" autocomplete="off">
              <div class="stepper">
                <button type="button" id="guess-down" aria-label="Fewer">−</button>
                <input id="guess" type="number" inputmode="numeric" min="1" max="1000000000" aria-label="Your guess" />
                <button type="button" id="guess-up" aria-label="More">+</button>
              </div>
              <button type="submit" id="commit" class="commit">Weigh it</button>
            </form>

            <section id="reveal" class="reveal" hidden aria-live="polite">
              <p class="answer">It takes about <strong id="answer"></strong>.</p>
              <p id="result" class="result"></p>
              <p id="fact" class="fact"></p>
              <button type="button" id="next" class="commit next" hidden>Next weigh-in</button>
            </section>
          </div>
        </div>
      </header>

      <!-- End of the day: total, rating, a recap of all five rounds and the share button. -->
      <section id="results" class="results panel" hidden>
        <p class="total"><strong id="total"></strong> <span id="total-max"></span></p>
        <p id="rating" class="rating"></p>
        <!-- Filled in only when the stats server answers (see crowd.ts). -->
        <p id="crowd-rank" class="crowd-rank" hidden></p>
        <ol id="rounds" class="rounds"></ol>
        <button type="button" id="share" class="commit">Copy results</button>
        <pre id="share-text" class="share-text"></pre>
      </section>

      <button type="button" id="reset" class="dev" hidden>Reset (dev only)</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tipping Point</title>
  </head>
  <body>
    <main class="game">
      <header>
        <p class="eyebrow">Weigh-in 1 of 5</p>
        <h1>How many <span id="counter-name">blue whales</span> balance the <span id="anchor-name">Eiffel Tower</span>?</h1>
      </header>

      <svg id="scale" viewBox="0 0 400 330" role="img" aria-label="A balance scale with the Eiffel Tower on the left pan">
        <defs>
          <symbol id="whale" viewBox="0 0 16 12" overflow="visible">
            <path d="M1 7 C1 3 6 1 10 3 C12 4 13 5 15 3 L15.5 1.5 L15 6 C13.5 8 11 9.5 7 9.5 C3 9.5 1 8.5 1 7Z" fill="#4f7ea8" />
            <circle cx="4" cy="5.6" r=".7" fill="#12202e" />
          </symbol>
          <symbol id="tower" viewBox="0 0 60 100" overflow="visible">
            <path d="M30 0 L33 22 L38 40 L48 82 L60 100 L48 100 L41 86 L30 80 L19 86 L12 100 L0 100 L12 82 L22 40 L27 22Z" fill="#6b5a4a" />
            <rect x="21" y="38" width="18" height="3" fill="#8a7762" />
            <rect x="12" y="80" width="36" height="3" fill="#8a7762" />
          </symbol>
        </defs>

        <!-- stand -->
        <path d="M200 110 L200 295 M150 300 L250 300" stroke="#8c6a2f" stroke-width="8" stroke-linecap="round" />
        <circle cx="200" cy="110" r="9" fill="#c79a3b" />

        <!-- beam + needle rotate about the pivot -->
        <g id="beam"><rect x="60" y="106" width="280" height="8" rx="4" fill="#c79a3b" /></g>
        <g id="needle"><path d="M200 110 L200 70" stroke="#6e5420" stroke-width="3" stroke-linecap="round" /></g>

        <!-- pans hang from the beam ends and stay level -->
        <g id="pan-left">
          <path d="M0 0 L-52 108 M0 0 L52 108" stroke="#8c6a2f" stroke-width="1.5" />
          <use href="#tower" x="-28" y="12" width="56" height="96" />
          <path d="M-58 108 H58 Q52 126 0 126 Q-52 126 -58 108Z" fill="#c79a3b" />
        </g>
        <g id="pan-right">
          <path d="M0 0 L-52 108 M0 0 L52 108" stroke="#8c6a2f" stroke-width="1.5" />
          <g id="pile" transform="translate(0 108)"></g>
          <path d="M-58 108 H58 Q52 126 0 126 Q-52 126 -58 108Z" fill="#c79a3b" />
        </g>
      </svg>

      <p id="count-readout" class="readout" aria-live="off">&nbsp;</p>

      <form id="controls" class="controls" autocomplete="off">
        <div class="stepper">
          <button type="button" id="guess-down" aria-label="Fewer">−</button>
          <input id="guess" type="number" inputmode="numeric" min="1" max="100000" aria-label="Your guess" />
          <button type="button" id="guess-up" aria-label="More">+</button>
        </div>
        <button type="submit" id="commit" class="commit">Weigh it</button>
      </form>

      <section id="reveal" class="reveal" hidden aria-live="polite">
        <p class="answer">It takes about <strong id="answer"></strong>.</p>
        <p id="result" class="result"></p>
        <p id="fact" class="fact"></p>
      </section>

      <button type="button" id="reset" class="dev" hidden>Reset (dev only)</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
